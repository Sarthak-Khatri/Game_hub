<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Memory Card Game</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Back Button -->
    <a href="../../games-hub.html" class="back-btn" style="position: fixed; top: 20px; left: 20px; z-index: 1000; background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 50px; text-decoration: none; font-weight: 600; border: 2px solid #6366f1; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(10px);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back
    </a>
    
    <div class="game-container">
      <header class="game-header">
        <h1>🧠 Memory Cards</h1>
        <p class="subtitle">Match all the pairs to win!</p>
        <div class="game-stats">
          <div class="stat-item">
            <span class="stat-label">Moves</span>
            <span class="score">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Time</span>
            <span class="timer">00:00</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Matches</span>
            <span class="matches">0</span>
          </div>
        </div>
      </header>

      <div class="difficulty-selector">
        <h3>Choose Difficulty</h3>
        <div class="difficulty-buttons">
          <button class="difficulty-btn active" data-level="easy">
            <span class="difficulty-icon">😊</span>
            <span class="difficulty-name">Easy</span>
            <span class="difficulty-desc">3×4 Grid</span>
          </button>
          <button class="difficulty-btn" data-level="medium">
            <span class="difficulty-icon">😎</span>
            <span class="difficulty-name">Medium</span>
            <span class="difficulty-desc">4×4 Grid</span>
          </button>
          <button class="difficulty-btn" data-level="hard">
            <span class="difficulty-icon">😤</span>
            <span class="difficulty-name">Hard</span>
            <span class="difficulty-desc">6×4 Grid</span>
          </button>
        </nav>
      </section>

      <section class="grid-container" aria-label="Game board">
        <!-- Cards will be generated here -->
      </section>
    </main>

    <!-- Restart Button Fixed at Bottom -->
    <button class="restart-btn-fixed" onclick="restart()" title="Restart Game">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M3 21v-5h5"/>
      </svg>
    </button>

    <div class="game-over-modal" id="gameOverModal">
        <canvas id="confetti-canvas"></canvas>
        <div class="modal-content">
          <div class="modal-icon">🎉</div>
          <h2>Congratulations!</h2>
          <p class="modal-message">You completed the game!</p>
          <div class="final-stats">
            <div class="stat-row">
              <span class="stat-label-modal">Final Moves:</span>
              <span class="stat-value" id="finalScore"></span>
            </div>
            <div class="stat-row">
              <span class="stat-label-modal">Time:</span>
              <span class="stat-value" id="finalTime"></span>
            </div>
            <div class="stat-row">
              <span class="stat-label-modal">Difficulty:</span>
              <span class="stat-value" id="finalDifficulty"></span>
            </div>
          </div>
          <button class="action-btn play-again-btn" onclick="closeModal()">
            🎮 Play Again
          </button>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
