<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SnakeMania - Enhanced Snake Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="background-animation"></div>
    
    <div class="body">
        <div class="game-container">
            <!-- Game Title -->
            <div class="game-title">
                <h1>🐍 SNAKE MANIA</h1>
                <p class="subtitle">Eat, Grow, Survive!</p>
            </div>

            <!-- Game Header with scores and controls -->
            <div class="game-header">
                <div class="score-section">
                    <div class="score-card">
                        <span class="label">SCORE</span>
                        <span id="scoreBox" class="value">0</span>
                    </div>
                    <div class="score-card highlight">
                        <span class="label">🏆 HIGH SCORE</span>
                        <span id="hiscoreBox" class="value">0</span>
                    </div>
                </div>
                <div class="controls-section">
                    <button class="control-btn pause-btn" id="pauseBtn">
                        <span class="icon">⏸</span> Pause
                    </button>
                    <button class="control-btn speed-btn" id="speedBtn">
                        <span class="icon">⚡</span> Normal
                    </button>
                    <button class="control-btn sound-btn" id="soundBtn">
                        <span class="icon">🔊</span>
                    </button>
                </div>
            </div>

            <!-- Game Board -->
            <div class="board-wrapper">
                <div id="board">
                    <!-- Grid cells will be generated by JavaScript -->
                    <div class="pause-screen" id="pauseScreen">
                        <div class="pause-content">
                            <div class="pause-icon">⏸</div>
                            <h3>PAUSED</h3>
                            <p>Press <kbd>SPACE</kbd> to continue</p>
                        </div>
                    </div>
                </div>
                <div class="board-glow"></div>
            </div>

            <!-- Instructions -->
            <div class="instructions">
                <div class="instruction-group">
                    <div class="instruction-item">
                        <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd>
                        <span>Move</span>
                    </div>
                    <div class="instruction-item">
                        <kbd>W A S D</kbd>
                        <span>Move</span>
                    </div>
                    <div class="instruction-item">
                        <kbd>SPACE</kbd>
                        <span>Pause</span>
                    </div>
                    <div class="instruction-item">
                        <kbd>ESC</kbd>
                        <span>Restart</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="game-over-modal" id="gameOverModal">
        <div class="modal-overlay"></div>
        <div class="game-over-content">
            <div class="game-over-icon">💀</div>
            <h2>GAME OVER!</h2>
            <div class="score-display">
                <div class="final-score">
                    <span class="label">Final Score</span>
                    <span id="finalScore" class="value">0</span>
                </div>
                <p id="highScoreMessage" class="high-score-msg"></p>
            </div>
            <button class="restart-btn" id="restartBtn">
                <span class="icon">🔄</span> Play Again
            </button>
        </div>
    </div>

    <script src="js/index.js"></script>
</body>
</html>
