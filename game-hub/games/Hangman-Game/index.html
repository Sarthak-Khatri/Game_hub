<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangman Game - Game Hub</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Play Hangman - Guess the word letter by letter! Features multiple categories (Animals, Countries, Fruits) with hints. Part of Game Hub collection.">
  <meta name="keywords" content="hangman game, word guessing game, letter game, vocabulary game, educational game">
  <meta name="author" content="Game Hub">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Hangman Game - Game Hub">
  <meta property="og:description" content="Play Hangman - Guess the word letter by letter! Features multiple categories with hints.">
  <meta property="og:image" content="../../og.png">
  <meta property="og:image:alt" content="Hangman Game">
  <meta property="og:url" content="">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Game Hub">
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Hangman Game - Game Hub">
  <meta name="twitter:description" content="Play Hangman - Guess the word letter by letter!">
  <meta name="twitter:image" content="../../og.png">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../../fb.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../../fb.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../fb.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../fb.png">
  <link rel="manifest" href="../../site.webmanifest">
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#6366f1">
  <meta name="msapplication-TileColor" content="#6366f1">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../shared/styles.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Apply theme to body immediately -->
  <script>
    (function() {
      let theme = localStorage.getItem('gameHubTheme');
      if (!theme) {
        try {
          const settings = JSON.parse(localStorage.getItem('gameHubSettings') || '{}');
          theme = settings.theme;
        } catch (e) {}
      }
      document.body.className = 'theme-' + (theme || 'dark');
    })();
  </script>
  
  <!-- Back Button -->
  <div class="btn btn-secondary back-button" onclick="navigateWithLoading('../../games-hub.html', 'Going Back...')" style="cursor: pointer;">
    <i class="fas fa-arrow-left"></i> Back
  </div>
  
  <div class="game-container">
    <h1>Hangman Game</h1>
    
    <!-- Result Modal -->
    <div id="result-modal" class="result-modal">
      <div class="result-modal-content">
        <div class="particles-container" id="particles-container"></div>
        <div class="result-icon" id="result-icon">🎉</div>
        <h2 class="result-title" id="result-title">Congratulations!</h2>
        <p class="result-message" id="result-message">You won!</p>
        <div class="result-stats">
          <div class="result-stat">
            <span class="result-stat-label">Score</span>
            <span class="result-stat-value" id="result-score">0</span>
          </div>
          <div class="result-stat">
            <span class="result-stat-label">Word</span>
            <span class="result-stat-value" id="result-word">WORD</span>
          </div>
          <div class="result-stat">
            <span class="result-stat-label">Streak</span>
            <span class="result-stat-value" id="result-streak">0</span>
          </div>
        </div>
        <div class="result-buttons">
          <button class="result-btn play-again-btn" id="play-again-btn">
            <i class="fas fa-redo"></i> Play Again
          </button>
          <button class="result-btn close-modal-btn" id="close-modal-btn">
            <i class="fas fa-times"></i> Close
          </button>
        </div>
      </div>
    </div>
    
    <div class="game-status">
      <div class="status-item">
        <i class="fas fa-heart"></i>
        <span id="remaining-guesses">Remaining guesses: 6</span>
      </div>
      <div class="status-item">
        <i class="fas fa-tag"></i>
        <span id="category">Category: Animals</span>
      </div>
      <div class="status-item">
        <i class="fas fa-star"></i>
        <span id="current-score">Score: 0</span>
      </div>
    </div>
    
    <div class="hint-section">
      <div class="hint-container">
        <i class="fas fa-lightbulb"></i>
        <span id="hint-text">Click the hint button for a clue!</span>
      </div>
      <button id="hint-btn" class="hint-btn">
        <i class="fas fa-question-circle"></i> Get Hint
      </button>
    </div>
    
    <div class="hangman-container">
      <div class="hangman-wrapper">
        <svg id="hangman-svg" width="200" height="200" viewBox="0 0 200 200">
          <!-- Gallows -->
          <line x1="20" y1="180" x2="100" y2="180" stroke="#8B4513" stroke-width="6"/>
          <line x1="60" y1="180" x2="60" y2="20" stroke="#8B4513" stroke-width="6"/>
          <line x1="60" y1="20" x2="140" y2="20" stroke="#8B4513" stroke-width="6"/>
          <line x1="140" y1="20" x2="140" y2="40" stroke="#8B4513" stroke-width="4"/>
          
          <!-- Hangman parts (hidden by default) -->
          <!-- Head -->
          <circle id="head" cx="140" cy="60" r="20" stroke="#333" stroke-width="3" fill="#ffdbac" style="display: none;"/>
          <!-- Body -->
          <line id="body" x1="140" y1="80" x2="140" y2="130" stroke="#333" stroke-width="4" style="display: none;"/>
          <!-- Arms -->
          <line id="left-arm" x1="140" y1="100" x2="110" y2="90" stroke="#333" stroke-width="3" style="display: none;"/>
          <line id="right-arm" x1="140" y1="100" x2="170" y2="90" stroke="#333" stroke-width="3" style="display: none;"/>
          <!-- Legs -->
          <line id="left-leg" x1="140" y1="130" x2="120" y2="160" stroke="#333" stroke-width="3" style="display: none;"/>
          <line id="right-leg" x1="140" y1="130" x2="160" y2="160" stroke="#333" stroke-width="3" style="display: none;"/>
          <!-- Face (shown when lost) -->
          <g id="face" style="display: none;">
            <circle cx="133" cy="55" r="2" fill="#333"/>
            <circle cx="147" cy="55" r="2" fill="#333"/>
            <path d="M130 70 Q140 75 150 70" stroke="#333" stroke-width="2" fill="transparent"/>
          </g>
        </svg>
      </div>
    </div>
    
    <div class="word-display" id="word-display">
      <!-- Word letters will appear here -->
    </div>
    
    <div class="keyboard" id="keyboard">
      <!-- Keyboard letters will be added by JavaScript -->
    </div>
    
    <div class="game-message" id="game-message"></div>
    
    <div class="game-controls">
      <button id="hint-btn-mobile" class="control-btn hint-btn-mobile">
        <i class="fas fa-lightbulb"></i>
        <span>Hint</span>
      </button>
      <button id="reset-btn" class="control-btn reset-btn">
        <i class="fas fa-redo"></i>
        <span>New Game</span>
      </button>
      <button id="reset-stats-btn" class="control-btn stats-reset-btn">
        <i class="fas fa-trash-alt"></i>
        <span>Reset Stats</span>
      </button>
    </div>
  </div>

  <script src="../../shared/themes.js"></script>
  <script src="../../shared/sound-manager.js"></script>
  <script src="../../shared/simple-loading.js"></script>
  <script src="script.js"></script>
  <script>
    function navigateWithLoading(url, text = 'Loading...') {
      SimpleLoading.showAndNavigate(url, text, 600);
    }
  </script>
</body>
</html>
