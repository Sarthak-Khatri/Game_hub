    <style>
        .achievements-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .achievements-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .achievements-title {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--current-primary), var(--current-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        
        .achievements-subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
            color: var(--current-text);
        }
        
        .progress-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }
        
        .progress-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--current-primary);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(20px);
        }
        
        .progress-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 
                        0 0 30px var(--current-primary);
        }
        
        .progress-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 10px var(--current-primary));
        }
        
        .progress-value {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--current-primary);
            margin-bottom: 0.5rem;
        }
        
        .progress-label {
            font-size: 1rem;
            opacity: 0.8;
        }
        
        .achievements-categories {
            margin-bottom: 3rem;
        }
        
        .category-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--current-primary);
            margin-bottom: 2rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }
        
        .achievement-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(20px);
            opacity: 0.5;
        }
        
        .achievement-card.unlocked {
            opacity: 1;
            border-color: var(--current-primary);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2), 
                        0 0 30px var(--current-primary);
        }
        
        .achievement-card.unlocked::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shimmer 2s ease-in-out infinite;
        }
        
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .achievement-card:hover {
            transform: translateY(-8px) scale(1.02);
        }
        
        .achievement-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .achievement-icon {
            font-size: 3rem;
            filter: drop-shadow(0 0 15px var(--current-primary));
            transition: all 0.3s ease;
        }
        
        .achievement-card.unlocked .achievement-icon {
            animation: bounce 2s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        .achievement-info {
            flex: 1;
        }
        
        .achievement-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--current-primary);
            margin-bottom: 0.5rem;
        }
        
        .achievement-description {
            font-size: 1rem;
            opacity: 0.8;
            line-height: 1.4;
        }
        
        .achievement-progress {
            margin-top: 1rem;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--current-primary), var(--current-accent));
            border-radius: 4px;
            transition: width 0.8s ease;
        }
        
        .progress-text {
            font-size: 0.9rem;
            opacity: 0.7;
            text-align: center;
        }
        
        .achievement-reward {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--current-accent);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .achievement-card.unlocked .achievement-reward {
            opacity: 1;
        }
        
        .back-button {
            position: fixed;
            top: 2.5rem;
            left: 2.5rem;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--current-primary);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-weight: 600;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .back-button:hover {
            background: var(--current-primary);
            color: white;
            transform: translateX(-8px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }
        
        .back-button i {
            font-size: 1.1rem;
            transition: transform 0.3s ease;
        }
        
        .back-button:hover i {
            transform: scale(1.2);
        }
        
        @media (max-width: 768px) {
            .achievements-title {
                font-size: 2.5rem;
            }
            
            .achievements-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            
            .achievement-card {
                padding: 1.5rem;
            }
            
            .achievement-header {
                gap: 1rem;
            }
            
            .achievement-icon {
                font-size: 2.5rem;
            }
            
            .achievement-name {
                font-size: 1.3rem;
            }
            
            .back-button {
                top: 1.5rem;
                left: 1.5rem;
                padding: 0.8rem 1.2rem;
                font-size: 0.9rem;
            }
        }
        
        @media (max-width: 480px) {
            .progress-overview {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
            
            .progress-card {
                padding: 1.5rem;
            }
            
            .progress-icon {
                font-size: 2.5rem;
            }
            
            .progress-value {
                font-size: 2rem;
            }
        }
    </style>

        function getPlayerStats() {
            const stats = {
                totalGames: 0,
                totalWins: 0,
                totalScore: 0,
                gamesPlayed: 0,
                snakeScore: 0,
                memoryBestTime: 0,
                reactionBestTime: 0
            };
            
            // Snake Game
            const snakeScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
            if (snakeScore > 0) {
                stats.totalGames += 1;
                stats.totalWins += 1;
                stats.totalScore += snakeScore;
                stats.gamesPlayed += 1;
                stats.snakeScore = snakeScore;
            }
            
            // Tic Tac Toe
            try {
                const tttStats = JSON.parse(localStorage.getItem('tictactoeStats') || '{}');
                const games = (tttStats.wins || 0) + (tttStats.losses || 0) + (tttStats.ties || 0);
                if (games > 0) {
                    stats.totalGames += games;
                    stats.totalWins += (tttStats.wins || 0);
                    stats.totalScore += (tttStats.wins || 0) * 10;
                    stats.gamesPlayed += 1;
                }
            } catch (e) {}
            
            // Memory Match
            const memoryTime = parseInt(localStorage.getItem('memoryBestTime_8')) || 0;
            if (memoryTime > 0) {
                stats.totalGames += 1;
                stats.totalWins += 1;
                stats.totalScore += Math.max(0, 1000 - memoryTime);
                stats.gamesPlayed += 1;
                stats.memoryBestTime = memoryTime;
            }
            
            // Whack-a-Mole
            const whackScore = parseInt(localStorage.getItem('whackHighScore')) || 0;
            if (whackScore > 0) {
                stats.totalGames += 1;
                stats.totalWins += 1;
                stats.totalScore += whackScore;
                stats.gamesPlayed += 1;
            }
            
            // Rock Paper Scissors
            try {
                const rpsStats = JSON.parse(localStorage.getItem('rpsStats') || '{}');
                const games = (rpsStats.wins || 0) + (rpsStats.losses || 0) + (rpsStats.ties || 0);
                if (games > 0) {
                    stats.totalGames += games;
                    stats.totalWins += (rpsStats.wins || 0);
                    stats.totalScore += (rpsStats.wins || 0) * 10;
                    stats.gamesPlayed += 1;
                }
            } catch (e) {}
            
            // Reaction Test
            const reactionTime = parseInt(localStorage.getItem('reactionBestTime')) || 0;
            if (reactionTime > 0) {
                stats.totalGames += 1;
                stats.totalWins += 1;
                stats.totalScore += Math.max(0, 1000 - reactionTime);
                stats.gamesPlayed += 1;
                stats.reactionBestTime = reactionTime;
            }
            
            // Hangman
            try {
                const hangmanStats = JSON.parse(localStorage.getItem('hangmanStats') || '{}');
                const games = (hangmanStats.wins || 0) + (hangmanStats.losses || 0);
                if (games > 0) {
                    stats.totalGames += games;
                    stats.totalWins += (hangmanStats.wins || 0);
                    stats.totalScore += (hangmanStats.wins || 0) * 15; // Higher score for word games
                    stats.gamesPlayed += 1;
                }
            } catch (e) {}
            
            return stats;
        }
        
        function getHangmanWins() {
            try {
                const hangmanStats = JSON.parse(localStorage.getItem('hangmanStats') || '{}');
                return hangmanStats.wins || 0;
            } catch (e) {
                return 0;
            }
        }
        
        function renderAchievementCategory(categoryId, achievements) {
            const container = document.getElementById(`${categoryId}-achievements`);
            container.innerHTML = '';
            
            achievements.forEach(achievement => {
                const card = document.createElement('div');
                card.className = `achievement-card ${achievement.condition ? 'unlocked' : ''}`;
                
                const progressPercentage = (achievement.progress / achievement.target) * 100;
                
                card.innerHTML = `
                    <div class="achievement-reward">${achievement.reward}</div>
                    <div class="achievement-header">
                        <div class="achievement-icon">${achievement.icon}</div>
                        <div class="achievement-info">
                            <div class="achievement-name">${achievement.name}</div>
                            <div class="achievement-description">${achievement.description}</div>
                        </div>
                    </div>
                    <div class="achievement-progress">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progressPercentage}%"></div>
                        </div>
                        <div class="progress-text">${achievement.progress}/${achievement.target}</div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }
        
        function updateProgressOverview(achievements) {
            let totalAchievements = 0;
            let unlockedAchievements = 0;
            let totalPoints = 0;
            let nextAchievement = null;
            let minProgress = Infinity;
            
            // Count achievements and points
            Object.values(achievements).forEach(category => {
                category.forEach(achievement => {
                    totalAchievements++;
                    if (achievement.condition) {
                        unlockedAchievements++;
                        totalPoints += achievement.points;
                    } else {
                        const progressRatio = achievement.progress / achievement.target;
                        if (progressRatio < minProgress) {
                            minProgress = progressRatio;
                            nextAchievement = achievement.name;
                        }
                    }
                });
            });
            
            const completionPercentage = Math.round((unlockedAchievements / totalAchievements) * 100);
            
            // Update display
            document.getElementById('unlocked-count').textContent = `${unlockedAchievements}/${totalAchievements}`;
            document.getElementById('completion-percentage').textContent = `${completionPercentage}%`;
            document.getElementById('total-points').textContent = totalPoints.toLocaleString();
            document.getElementById('next-achievement').textContent = nextAchievement || 'All Complete!';
        }
        
        function navigateWithLoading(url, text = 'Loading...') {
            SimpleLoading.showAndNavigate(url, text, 600);
        }
    </script>
</body>
