<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile - Game Hub</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="View your gaming profile, statistics, achievements, and progress across all Game Hub mini-games. Track your wins, scores, and level up!">
    <meta name="keywords" content="player profile, gaming stats, game statistics, achievements, player level, gaming progress">
    <meta name="author" content="Game Hub">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Player Profile - Game Hub">
    <meta property="og:description" content="View your gaming profile, statistics, achievements, and progress across all Game Hub mini-games!">
    <meta property="og:image" content="../assets/images/og.png">
    <meta property="og:image:alt" content="Game Hub Player Profile">
    <meta property="og:url" content="">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Game Hub">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Player Profile - Game Hub">
    <meta name="twitter:description" content="View your gaming profile, statistics, and achievements!">
    <meta name="twitter:image" content="../assets/images/og.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/fb.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/fb.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/fb.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/fb.png">
    <link rel="manifest" href="../site.webmanifest">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#6366f1">
    <meta name="msapplication-TileColor" content="#6366f1">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="shared/styles.css">
    <style>
        .profile-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--current-primary), var(--current-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            margin: 0 auto 1rem;
            border: 4px solid var(--current-accent);
        }
        
        .profile-name {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--current-primary);
            margin-bottom: 0.5rem;
        }
        
        .profile-level {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 1rem;
        }
        
        .profile-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }
        
        .stat-card {
            background: var(--current-surface);
            border: 2px solid var(--current-primary);
            border-radius: 15px;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--current-glow, var(--current-shadow)) var(--current-primary);
        }
        
        .stat-icon {
            font-size: 3rem;
            color: var(--current-accent);
            margin-bottom: 1rem;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--current-primary);
            margin-bottom: 0.5rem;
        }
        
        .stat-label {
            font-size: 1rem;
            opacity: 0.8;
        }
        
        .games-progress {
            margin-bottom: 3rem;
        }
        
        .section-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--current-primary);
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .game-progress-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        
        .game-progress-card {
            background: var(--current-surface);
            border: 2px solid var(--current-primary);
            border-radius: 15px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .game-progress-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--current-glow, var(--current-shadow)) var(--current-primary);
        }
        
        .game-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .game-icon {
            font-size: 2rem;
        }
        
        .game-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--current-primary);
        }
        
        .game-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        
        .game-stat {
            text-align: center;
        }
        
        .game-stat-value {
            display: block;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--current-accent);
        }
        
        .game-stat-label {
            font-size: 0.8rem;
            opacity: 0.7;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--current-bg);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--current-primary), var(--current-accent));
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .back-button {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 100;
        }
    </style>
</head>
<body class="theme-dark min-h-screen">
    <!-- Video Background -->
    <video class="video-background" autoplay muted loop>
        <source src="assets/videos/bg2.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
    
    <!-- Particles Background -->
    <!-- <div id="particles-js"></div> -->
    
    <!-- Back Button -->
    <div class="btn btn-secondary back-button" onclick="navigateWithLoading('main-menu.html', 'Going Back...')" style="cursor: pointer;">
        <i class="fas fa-arrow-left"></i> Back
    </div>
    
    <!-- Profile Container -->
    <div class="profile-container">
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-avatar">🎮</div>
            <h1 class="profile-name">Player</h1>
            <p class="profile-level">Level <span id="player-level">1</span> Gamer</p>
        </div>
        
        <!-- Overall Stats -->
        <div class="profile-stats">
            <div class="stat-card">
                <div class="stat-icon">🎯</div>
                <div class="stat-value" id="total-games-played">0</div>
                <div class="stat-label">Games Played</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏆</div>
                <div class="stat-value" id="total-wins">0</div>
                <div class="stat-label">Total Wins</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-value" id="total-score">0</div>
                <div class="stat-label">Total Score</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-value" id="win-streak">0</div>
                <div class="stat-label">Best Streak</div>
            </div>
        </div>
        
        <!-- Games Progress -->
        <div class="games-progress">
            <h2 class="section-title">Game Progress</h2>
            <div class="game-progress-grid" id="games-grid">
                <!-- Game cards will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script src="shared/themes.js"></script>
    <script src="shared/sound-manager.js"></script>
    <!-- <script src="shared/particles.js"></script> -->
    <script src="shared/simple-loading.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadPlayerProfile();
            
            // Animate elements on load
            if (typeof anime !== 'undefined') {
                anime({
                    targets: '.profile-header',
                    translateY: [-50, 0],
                    opacity: [0, 1],
                    duration: 800,
                    easing: 'easeOutQuad'
                });
                
                anime({
                    targets: '.stat-card',
                    scale: [0, 1],
                    opacity: [0, 1],
                    duration: 600,
                    delay: anime.stagger(100, {start: 500}),
                    easing: 'easeOutElastic(1, .8)'
                });
            }
        });
        
        function loadPlayerProfile() {
            const games = [
                { 
                    name: 'Snake', 
                    icon: '🐍', 
                    key: 'snakeHighScore',
                    type: 'score'
                },
                { 
                    name: 'Tic Tac Toe', 
                    icon: '⭕', 
                    key: 'tictactoeStats',
                    type: 'stats'
                },
                { 
                    name: 'Memory Match', 
                    icon: '🧠', 
                    key: 'memoryBestTime_8',
                    type: 'time'
                },
                { 
                    name: 'Whack-a-Mole', 
                    icon: '🔨', 
                    key: 'whackHighScore',
                    type: 'score'
                },
                { 
                    name: 'Rock Paper Scissors', 
                    icon: '✂️', 
                    key: 'rpsStats',
                    type: 'stats'
                },
                { 
                    name: 'Reaction Test', 
                    icon: '⚡', 
                    key: 'reactionBestTime',
                    type: 'time'
                },
                { 
                    name: 'Hangman', 
                    icon: '🎯', 
                    key: 'hangmanStats',
                    type: 'stats'
                }
            ];
            
            let totalGames = 0;
            let totalWins = 0;
            let totalScore = 0;
            let bestStreak = 0;
            
            const gamesGrid = document.getElementById('games-grid');
            gamesGrid.innerHTML = '';
            
            games.forEach(game => {
                const saved = localStorage.getItem(game.key);
                let gameData = {
                    played: 0,
                    won: 0,
                    score: 0,
                    progress: 0
                };
                
                if (saved) {
                    if (game.type === 'stats') {
                        try {
                            const stats = JSON.parse(saved);
                            gameData.played = (stats.wins || 0) + (stats.losses || 0) + (stats.ties || 0);
                            gameData.won = stats.wins || 0;
                            gameData.score = gameData.won * 10;
                            gameData.progress = gameData.played > 0 ? (gameData.won / gameData.played) * 100 : 0;
                        } catch (e) {}
                    } else if (game.type === 'score') {
                        const score = parseInt(saved) || 0;
                        gameData.score = score;
                        gameData.played = score > 0 ? 1 : 0;
                        gameData.won = score > 0 ? 1 : 0;
                        gameData.progress = Math.min((score / 1000) * 100, 100);
                    } else if (game.type === 'time') {
                        const time = parseInt(saved) || 0;
                        if (time > 0) {
                            gameData.played = 1;
                            gameData.won = 1;
                            gameData.score = Math.max(0, 1000 - time);
                            gameData.progress = Math.min((gameData.score / 500) * 100, 100);
                        }
                    }
                }
                
                totalGames += gameData.played;
                totalWins += gameData.won;
                totalScore += gameData.score;
                
                // Create game card
                const gameCard = document.createElement('div');
                gameCard.className = 'game-progress-card';
                gameCard.innerHTML = `
                    <div class="game-header">
                        <div class="game-icon">${game.icon}</div>
                        <div class="game-name">${game.name}</div>
                    </div>
                    <div class="game-stats">
                        <div class="game-stat">
                            <span class="game-stat-value">${gameData.played}</span>
                            <span class="game-stat-label">Played</span>
                        </div>
                        <div class="game-stat">
                            <span class="game-stat-value">${gameData.won}</span>
                            <span class="game-stat-label">Won</span>
                        </div>
                        <div class="game-stat">
                            <span class="game-stat-value">${gameData.score}</span>
                            <span class="game-stat-label">Score</span>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${gameData.progress}%"></div>
                    </div>
                `;
                gamesGrid.appendChild(gameCard);
            });
            
            // Update overall stats
            document.getElementById('total-games-played').textContent = totalGames;
            document.getElementById('total-wins').textContent = totalWins;
            document.getElementById('total-score').textContent = totalScore.toLocaleString();
            document.getElementById('win-streak').textContent = Math.floor(totalWins / 5); // Simple streak calculation
            
            // Calculate player level
            const level = Math.floor(totalScore / 1000) + 1;
            document.getElementById('player-level').textContent = level;
        }
        
        function navigateWithLoading(url, text = 'Loading...') {
            SimpleLoading.showAndNavigate(url, text, 600);
        }
    </script>
</body>
</html>
